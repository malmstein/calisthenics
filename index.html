<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calisthenics">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calisthenics</title>
<style>
:root {
  --bg: #f4f4f1; --card: #fff; --text: #17181b; --muted: #6b6f76; --line: #e2e2dd;
  --accent: #e8590c; --ok: #2b8a3e; --ok-bg: #e6f4ea;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161a; --card: #1e2126; --text: #eceef1; --muted: #9aa0a8; --line: #2e3238;
          --accent: #ff7a33; --ok: #69db7c; --ok-bg: #1d3324; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.35rem; margin: 8px 0 2px; }
h2 { font-size: 1.05rem; margin: 24px 0 8px; }
.sub, .muted { color: var(--muted); font-size: .9rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
.card h3 { margin: 0; font-size: 1.05rem; }
.set { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.set label { width: 52px; color: var(--muted); font-size: .9rem; }
input[type=number], input[type=text] { font: inherit; color: inherit; background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; min-width: 0; }
.set input { width: 90px; text-align: center; font-size: 1.15rem; }
button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
  background: var(--line); color: var(--text); }
button.primary { background: var(--accent); color: #fff; font-weight: 600; width: 100%; padding: 14px; margin-top: 8px; }
.set button { min-width: 52px; font-size: 1.1rem; }
.set.done button { background: var(--ok); color: #fff; }
.set.done input { border-color: var(--ok); background: var(--ok-bg); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.lad { display: grid; grid-template-columns: 28px 1fr; gap: 6px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.lad .ctl { grid-column: 2; display: flex; align-items: center; gap: 12px; }
.lad .ctl input[type=number] { width: 56px; padding: 6px; margin-left: 4px; }
.lad .btns { display: flex; gap: 4px; margin-left: auto; }
.lad .btns button { padding: 8px 10px; }
.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; }
.field input { width: 96px; }
#timer { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom)); background: var(--accent);
  color: #fff; text-align: center; padding: 14px; font-weight: 600; font-size: 1.1rem; }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; background: none; border-radius: 0; padding: 18px 0; color: var(--muted); }
nav button.on { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main id="app"></main>
<div id="timer" data-act="skip" hidden></div>
<nav>
  <button data-act="tab" data-tab="today">Today</button>
  <button data-act="tab" data-tab="progress">Progress</button>
  <button data-act="tab" data-tab="settings">Settings</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
